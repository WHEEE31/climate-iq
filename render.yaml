# Render blueprint — https://render.com/docs/blueprint-spec
# Push this repo to GitHub, then in Render: New > Blueprint > pick the repo.
services:
  - type: web
    name: climate-iq
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production below makes npm skip
    # devDependencies, and vite/esbuild/typescript live there. They're only
    # needed to build — the runtime image doesn't use them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
